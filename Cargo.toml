[package]
name = "freshthread-bridge"
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MPL-2.0"

# Deliberately independent of the private FreshThread workspace.
[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
sha2 = "=0.11.0"
hmac = "=0.13.0"
zeroize = "=1.9.0"
rmcp = { version = "=2.2.0", features = ["server", "transport-io", "schemars"] }
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "process", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
